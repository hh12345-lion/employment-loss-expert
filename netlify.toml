[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# AHREFS_WWW_APEX_REDIRECT — flatten https://www → apex (reduces Ahrefs redirect-chain)
[[redirects]]
  from = "/*"
  to = "https://employmentlossexpert.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.employmentlossexpert.com"]}

[[redirects]]
  from = "/api/submit-lead"
  to = "/.netlify/functions/submit-lead"
  status = 200
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
