[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Lead submissions use Next.js App Router /api/submit-lead (Sheets + webhook).
# Do not force-redirect to a Netlify function — it bypasses the Next route and
# breaks when only Netlify env vars for the Next runtime are set.
# [[redirects]]
#   from = "/api/submit-lead"
#   to = "/.netlify/functions/submit-lead"
#   status = 200
#   force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
